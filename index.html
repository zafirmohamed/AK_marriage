<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZOAR Frames AR</title>
  <style>
    body { margin: 0; background: #000; }
    #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

    /* ================= START SCREEN ================= */
    #splash {
      position: fixed; inset: 0; z-index: 20;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0s 0s;
      overflow: hidden;
    }
    #splash.hide {
      opacity: 0; pointer-events: none; visibility: hidden;
      transition: opacity 0.6s ease, visibility 0s 0.6s;
    }

    /* Full screen GIF background */
    #bgGif {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none;
    }
    #bgGif::after {
      content: ""; position: absolute; top: 0; left: 0;
      width: 118%; height: 118%;
      background: url('sparkle.gif') center / cover no-repeat;
    }

    /* Logo */
    #logo {
      position: relative; z-index: 1;
      width: min(70vw, 340px); height: auto; display: block;
    }
    .logoText {
      position: relative; z-index: 1;
      color: #d9ad63; text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 54px; letter-spacing: 10px; line-height: 1;
    }
    .logoText small { display: block; margin-top: 10px; font-size: 16px; letter-spacing: 8px; }

    /* Gold button */
    #startBtn {
      position: relative; z-index: 1;
      margin-top: 16vh;
      padding: 14px 34px; font-size: 20px; font-weight: 600;
      border: none; border-radius: 12px;
      color: #1c1306;
      background: linear-gradient(180deg, #ebc47e, #cc9d57);
      box-shadow: 0 0 22px rgba(224, 178, 100, 0.35);
    }
    #startBtn:disabled { opacity: 0.7; }

    /* ================= BACK + PLAY/PAUSE + RESTART ================= */
    #controls {
      position: fixed; z-index: 10;
      left: 50%; transform: translateX(-50%);
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      display: none; gap: 10px;
    }
    #controls button {
      padding: 12px 20px; font-size: 16px;
      border: none; border-radius: 999px;
      background: rgba(0, 0, 0, 0.65); color: #fff;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="container"></div>

  <!-- START SCREEN -->
  <div id="splash">
    <div id="bgGif"></div>
    <img id="logo" src="logo.png" alt="ZOAR FRAMES"
         onerror="this.outerHTML='<div class=&quot;logoText&quot;>ZOAR<small>FRAMES</small></div>'">
    <button id="startBtn">Tap to Scan</button>
  </div>

  <!-- Control buttons -->
  <div id="controls">
    <button id="backBtn">Back</button>
    <button id="playPauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    const IMG_RATIO = 0.6615;

    // ---- Video element ----
    const video = document.createElement('video');
    video.src = './video.mp4';
    video.loop = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.preload = 'auto';

    // ---- Elements ----
    const startBtn = document.querySelector('#startBtn');
    const backBtn = document.querySelector('#backBtn');
    const playPauseBtn = document.querySelector('#playPauseBtn');
    const restartBtn = document.querySelector('#restartBtn');
    const splash = document.querySelector('#splash');
    const controls = document.querySelector('#controls');
    const container = document.querySelector('#container');

    // ---- Session state ----
    let targetVisible = false;
    let userPaused = false;
    let current = null;
    let sessionId = 0;
    let cleanupPromise = Promise.resolve();

    const refresh = () => {
      if (targetVisible && !userPaused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
      playPauseBtn.textContent = userPaused ? 'Play' : 'Pause';
    };

    playPauseBtn.addEventListener('click', () => {
      userPaused = !userPaused;
      refresh();
    });

    restartBtn.addEventListener('click', () => {
      video.currentTime = 0;
      userPaused = false;
      refresh();
    });

    // ---- Start one AR session ----
    const start = async (id) => {
      const mindarThree = new MindARThree({
        container,
        imageTargetSrc: './targets.mind',
        filterMinCF: 0.001,
        filterBeta: 1000,
        warmupTolerance: 5,
        missTolerance: 5
      });

      const { renderer, scene, camera } = mindarThree;
      const session = { mindarThree, renderer };
      current = session;

      let videoTexture = null;
      let videoMaterial = null;

      try {
        videoTexture = new THREE.VideoTexture(video);
        videoTexture.encoding = THREE.sRGBEncoding;
        videoTexture.flipY = false;

        videoMaterial = new THREE.MeshBasicMaterial({
          map: videoTexture,
          side: THREE.DoubleSide
        });

        // Load the model, then check whether this session was cancelled.
        const gltf = await new GLTFLoader().loadAsync('./model.glb');

        if (id !== sessionId || current !== session) {
          videoTexture.dispose();
          videoMaterial.dispose();
          return;
        }

        const plane = gltf.scene;
        plane.traverse((o) => {
          if (o.isMesh) o.material = videoMaterial;
        });

        const raw = new THREE.Box3()
          .setFromObject(plane)
          .getSize(new THREE.Vector3());

        if (raw.y <= raw.x && raw.y <= raw.z) {
          plane.rotation.x = Math.PI / 2;
        } else if (raw.x <= raw.y && raw.x <= raw.z) {
          plane.rotation.y = Math.PI / 2;
        }

        const pivot = new THREE.Group();
        pivot.add(plane);
        pivot.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(pivot);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        plane.position.sub(center);
        pivot.scale.set(1 / size.x, IMG_RATIO / size.y, 1);
        pivot.position.z = 0.001;

        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(pivot);

        anchor.onTargetFound = () => {
          if (id !== sessionId || current !== session) return;
          targetVisible = true;
          refresh();
        };

        anchor.onTargetLost = () => {
          if (id !== sessionId || current !== session) return;
          targetVisible = false;
          refresh();
        };

        // Check cancellation before and after camera startup.
        if (id !== sessionId || current !== session) return;

        await mindarThree.start();

        if (id !== sessionId || current !== session) {
          try { await mindarThree.stop(); } catch (_) {}
          renderer.setAnimationLoop(null);
          return;
        }

        controls.style.display = 'flex';
        renderer.setAnimationLoop(() => renderer.render(scene, camera));

      } catch (error) {
        if (current === session) current = null;

        try { await mindarThree.stop(); } catch (_) {}
        try {
          renderer.setAnimationLoop(null);
          renderer.dispose();
        } catch (_) {}

        if (videoMaterial) videoMaterial.dispose();
        else if (videoTexture) videoTexture.dispose();

        throw error;
      }
    };

    // ---- Stop the active session and return home ----
    const goHome = async () => {
      // Invalidate in-flight startup immediately, before waiting for cleanup.
      ++sessionId;

      video.pause();
      try { video.currentTime = 0; } catch (_) {}

      targetVisible = false;
      userPaused = false;
      playPauseBtn.textContent = 'Pause';

      controls.style.display = 'none';
      startBtn.disabled = true;
      startBtn.textContent = 'Closing scanner...';

      // Serialize cleanup so two Back clicks cannot overlap teardown.
      cleanupPromise = cleanupPromise.then(async () => {
        const session = current;
        current = null;

        if (session) {
          try {
            await session.mindarThree.stop();
          } catch (error) {
            console.warn('AR stop:', error);
          }

          try {
            session.renderer.setAnimationLoop(null);
            session.renderer.dispose();
          } catch (error) {
            console.warn('Renderer cleanup:', error);
          }
        }

        // Remove the previous AR canvas and any remaining scanner elements.
        container.replaceChildren();
      });

      await cleanupPromise;

      splash.classList.remove('hide');
      startBtn.disabled = false;
      startBtn.textContent = 'Tap to Scan';
    };

    backBtn.addEventListener('click', () => {
      goHome().catch((error) => console.error('Could not close scanner:', error));
    });

    // ---- Tap to Scan ----
    startBtn.addEventListener('click', async () => {
      if (startBtn.disabled) return;

      startBtn.disabled = true;
      startBtn.textContent = 'Loading...';
      const id = ++sessionId;

      // Unlock video playback on mobile browsers.
      video.play().then(() => video.pause()).catch(() => {});

      try {
        await cleanupPromise;
        if (id !== sessionId) return;

        splash.classList.add('hide');
        await start(id);

        if (id !== sessionId) return;
      } catch (error) {
        console.error(error);

        if (id === sessionId) {
          await goHome();
          alert('Camera access Allow pannitu marubadiyum try pannunga');
        }
        return;
      }

      if (id === sessionId) {
        startBtn.textContent = 'Tap to Scan';
      }
    });
  </script>
</body>
</html>
